<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
  @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; src: url('../../public/assets/fonts/cormorant-garamond-latin-400-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 100 900; src: url('../../public/assets/fonts/jost-latin-wght-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #120b0f; }
  body { position: relative; font-family: 'Jost', sans-serif; color: #f7ebe1; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(48% 70% at 80% 36%, rgba(244, 164, 104, 0.85), transparent 70%),
      radial-gradient(40% 60% at 66% 80%, rgba(201, 101, 144, 0.75), transparent 70%),
      radial-gradient(30% 40% at 92% 8%, rgba(221, 182, 127, 0.5), transparent 70%); filter: blur(10px); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #120b0f 18%, rgba(18, 11, 15, 0.2) 75%); }
  .content { position: absolute; left: 88px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 20px; letter-spacing: 0.34em; text-transform: uppercase; color: #ddb67f; font-weight: 500; }
  h1 { margin: 22px 0 18px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 148px; line-height: 0.9; }
  p { margin: 0; font-size: 30px; font-weight: 300; color: #e6d5ca; }
  .line { width: 120px; height: 2px; margin-top: 40px; background: linear-gradient(90deg, #f4a468, #c96590); }
</style>
</head>
<body>
  <div class="glow"></div><div class="shade"></div>
  <div class="content">
    <div class="eyebrow">Erotic spa &amp; sensual massage</div>
    <h1>Afterglow</h1>
    <p>Slow touch. Warm light. The glow that stays.</p>
    <div class="line"></div>
  </div>
</body>
</html>
